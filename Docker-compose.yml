version: '3.8'
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: friendlocato
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://admin:secret@postgres:5432/friendlocato
      JWT_SECRET: votre_secret_jwt

volumes:
  postgres_data: